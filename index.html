<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no"
    />
    <title>Vídeo Chamada P2P</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0a0e1a;
        color: #fff;
        height: 100vh;
        overflow: hidden;
      }
      #lobby {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 24px;
        gap: 18px;
      }
      #lobby h1 {
        font-size: 26px;
        background: linear-gradient(135deg, #4f8cff, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #lobby p {
        color: #8892b0;
        font-size: 13px;
        text-align: center;
        max-width: 320px;
        line-height: 1.5;
      }
      .input-group {
        display: flex;
        gap: 8px;
        width: 100%;
        max-width: 360px;
      }
      input {
        padding: 14px 16px;
        border: 1px solid #2a3348;
        border-radius: 12px;
        background: #151b2b;
        color: #fff;
        font-size: 16px;
        outline: none;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-align: center;
        flex: 1;
        min-width: 0;
      }
      input:focus {
        border-color: #4f8cff;
      }
      button {
        padding: 14px 22px;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
        transition: all 0.15s;
      }
      button:active {
        transform: scale(0.97);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-primary {
        background: linear-gradient(135deg, #4f8cff, #6366f1);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        max-width: 360px;
        color: #4a5568;
        font-size: 12px;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #2a3348;
      }
      #config-warn {
        background: #7f1d1d;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 12px;
        max-width: 360px;
        text-align: center;
        display: none;
      }
      #call {
        display: none;
        height: 100vh;
        position: relative;
        background: #000;
      }
      #remoteVideo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }
      #localVideo {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 100px;
        height: 140px;
        object-fit: cover;
        border-radius: 14px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        transform: scaleX(-1);
        z-index: 10;
        background: #111;
      }
      #localVideo.rear {
        transform: none;
      }
      #roomBadge {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(10px);
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 4px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        z-index: 10;
        cursor: pointer;
        user-select: none;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #roomBadge span:first-child {
        font-weight: 400;
        color: #8892b0;
        letter-spacing: 0;
        font-size: 14px;
      }
      #roomCode {
        color: #4f8cff;
      }
      #controls {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        z-index: 10;
      }
      .ctrl-btn {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        cursor: pointer;
        padding: 0;
      }
      .ctrl-btn svg {
        width: 22px;
        height: 22px;
        fill: #fff;
      }
      .ctrl-btn.off {
        background: rgba(239, 68, 68, 0.85);
      }
      .ctrl-btn.danger {
        background: #ef4444;
      }
      #status {
        position: absolute;
        bottom: 96px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        padding: 8px 18px;
        border-radius: 20px;
        font-size: 13px;
        z-index: 10;
        white-space: nowrap;
        max-width: 90vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #log {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 35vh;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.85);
        padding: 10px 14px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        line-height: 1.6;
        z-index: 20;
        border-top: 1px solid #222;
        transition: max-height 0.2s;
      }
      #log.collapsed {
        max-height: 26px;
        overflow: hidden;
      }
      #log .l {
        color: #8a93a6;
      }
      #log .ok {
        color: #10b981;
      }
      #log .err {
        color: #f87171;
      }
      #log .warn {
        color: #fbbf24;
      }
      #log .step {
        color: #60a5fa;
        font-weight: 600;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="lobby">
      <h1>📹 Vídeo Chamada P2P</h1>
      <p>WebRTC · Firebase · câmera frontal/traseira</p>
      <div id="config-warn">
        ⚠️ Preencha <code>firebaseConfig</code> no código
      </div>
      <button class="btn-primary" id="createBtn" onclick="createRoom()">
        ➕ Criar Nova Sala
      </button>
      <div class="divider">ou</div>
      <div class="input-group">
        <input
          type="text"
          id="roomInput"
          placeholder="CÓDIGO"
          maxlength="6"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="btn-primary" onclick="joinRoom()">Entrar</button>
      </div>
    </div>

    <div id="call">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <div id="roomBadge" onclick="copyRoomCode()" title="Clique para copiar">
        <span>Sala:</span><span id="roomCode">------</span>
      </div>
      <div id="status">Preparando…</div>
      <div id="controls">
        <button class="ctrl-btn" id="micBtn" onclick="toggleMic()">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"
            />
            <path
              d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"
            />
          </svg>
        </button>
        <button class="ctrl-btn" id="switchBtn" onclick="switchCamera()">
          <svg viewBox="0 0 24 24">
            <path
              d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"
            />
          </svg>
        </button>
        <button class="ctrl-btn danger" onclick="hangUp()">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"
            />
          </svg>
        </button>
        <button class="ctrl-btn" onclick="toggleLog()" title="Log">
          <svg viewBox="0 0 24 24">
            <path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h12v2H3z" />
          </svg>
        </button>
      </div>
      <div id="log" class="collapsed"></div>
    </div>

    <script type="module">
      /* ═══════════════════════════════════════════════════════════════
         IMPORTS (CDN — não precisa de bundler)
         ═══════════════════════════════════════════════════════════════ */
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getDatabase,
        ref,
        set,
        push,
        update,
        onValue,
        onChildAdded,
        remove,
        onDisconnect,
        get,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

      /* ═══════════════════════════════════════════════════════════════
         CONFIG FIREBASE (única, já preenchida)
         ═══════════════════════════════════════════════════════════════ */
      const firebaseConfig = {
        apiKey: "AIzaSyBIBtPaaLcevEy3PXdLaOp77UmURT_zZaE",
        authDomain: "trader-b13c9.firebaseapp.com",
        databaseURL: "https://trader-b13c9-default-rtdb.firebaseio.com",
        projectId: "trader-b13c9",
        storageBucket: "trader-b13c9.firebasestorage.app",
        messagingSenderId: "127165287666",
        appId: "1:127165287666:web:9b89e35bfb3fbb0ba1546b",
        measurementId: "G-TM60VT87GY",
      };

      /* ═══════════════════════════════════════════════════════════════
         LOG
         ═══════════════════════════════════════════════════════════════ */
      const logEl = () => document.getElementById("log");
      function log(msg, cls = "l") {
        const el = logEl();
        if (el) {
          const line = document.createElement("div");
          line.className = cls;
          line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
          el.appendChild(line);
          el.scrollTop = el.scrollHeight;
        }
        console.log(`[${cls}]`, msg);
      }
      window.toggleLog = () => logEl().classList.toggle("collapsed");

      /* ═══════════════════════════════════════════════════════════════
         INIT FIREBASE
         ═══════════════════════════════════════════════════════════════ */
      let app = null;
      let db = null;
      try {
        app = initializeApp(firebaseConfig);
        db = getDatabase(app);
        log("✓ Firebase inicializado", "ok");
      } catch (e) {
        log("❌ Erro Firebase: " + e.message, "err");
        document.getElementById("config-warn").style.display = "block";
      }

      /* ═══════════════════════════════════════════════════════════════
         WEBRTC CONFIG (STUN + TURN público)
         ═══════════════════════════════════════════════════════════════ */
      const rtcConfig = {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "stun:stun.cloudflare.com:3478" },
          {
            urls: "turn:openrelay.metered.ca:80",
            username: "openrelayproject",
            credential: "openrelayproject",
          },
          {
            urls: "turn:openrelay.metered.ca:443",
            username: "openrelayproject",
            credential: "openrelayproject",
          },
          {
            urls: "turn:openrelay.metered.ca:443?transport=tcp",
            username: "openrelayproject",
            credential: "openrelayproject",
          },
        ],
      };

      /* ═══════════════════════════════════════════════════════════════
         ESTADO
         ═══════════════════════════════════════════════════════════════ */
      let pc = null;
      let localStream = null;
      let roomId = null;
      let currentFacing = "user";
      let micEnabled = true;
      let unsubs = [];
      let pendingCandidates = [];
      let isCaller = false;
      let answererSeen = false;
      let hangingUp = false;

      /* ═══════════════════════════════════════════════════════════════
         HELPERS
         ═══════════════════════════════════════════════════════════════ */
      function genCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sem 0/O/1/I
        let c = "";
        for (let i = 0; i < 6; i++)
          c += chars[Math.floor(Math.random() * chars.length)];
        return c;
      }

      async function startCamera(facing = "user") {
        if (!navigator.mediaDevices?.getUserMedia)
          throw new Error("getUserMedia indisponível — use HTTPS ou localhost");
        return navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facing },
            width: { ideal: 1280 },
            height: { ideal: 720 },
          },
          audio: { echoCancellation: true, noiseSuppression: true },
        });
      }

      async function addCandidate(c) {
        if (!pc) return;
        if (pc.remoteDescription && pc.remoteDescription.type) {
          try {
            await pc.addIceCandidate(c);
            log("✓ ICE add", "ok");
          } catch (e) {
            log("⚠ ICE fail: " + e.message, "warn");
          }
        } else {
          pendingCandidates.push(c);
          log(`⏸ ICE na fila (${pendingCandidates.length})`, "warn");
        }
      }

      async function flushCandidates() {
        if (!pc) return;
        if (pendingCandidates.length)
          log(`▶ Liberando ${pendingCandidates.length} candidatos`, "step");
        for (const c of pendingCandidates) {
          try {
            await pc.addIceCandidate(c);
          } catch (e) {
            log("⚠ " + e.message, "warn");
          }
        }
        pendingCandidates = [];
      }

      function setStatus(m) {
        const el = document.getElementById("status");
        el.textContent = m;
        el.classList.remove("hidden");
      }

      function markConnected() {
        setStatus("Conectado ✓");
        setTimeout(() => {
          const el = document.getElementById("status");
          if (el.textContent === "Conectado ✓") el.classList.add("hidden");
        }, 2500);
      }

      function newPeer() {
        pc = new RTCPeerConnection(rtcConfig);

        pc.onicecandidate = (e) => {
          if (e.candidate && roomId) {
            push(
              ref(
                db,
                `rooms/${roomId}/${isCaller ? "callerCandidates" : "answererCandidates"}`,
              ),
              e.candidate.toJSON(),
            );
            log("→ ICE enviado", "l");
          }
        };

        pc.ontrack = (e) => {
          log("🎥 Vídeo remoto chegou!", "ok");
          const rv = document.getElementById("remoteVideo");
          rv.srcObject = e.streams[0];
          rv.play().catch(() => {
            log("⚠ Autoplay bloqueado — toque na tela", "warn");
            document.body.addEventListener(
              "click",
              () => rv.play().catch(() => {}),
              { once: true },
            );
          });
          markConnected();
        };

        pc.oniceconnectionstatechange = () => {
          if (!pc) return;
          const st = pc.iceConnectionState;
          log("ICE state: " + st, st === "failed" ? "err" : "l");
          if (st === "connected" || st === "completed") markConnected();
          if (st === "failed") setStatus("Falha de conexão (NAT?)");
        };

        return pc;
      }

      function showCall() {
        document.getElementById("lobby").style.display = "none";
        document.getElementById("call").style.display = "block";
        document.getElementById("localVideo").srcObject = localStream;
        document.getElementById("roomCode").textContent = roomId;
        document
          .getElementById("localVideo")
          .classList.toggle("rear", currentFacing === "environment");
      }

      /* ═══════════════════════════════════════════════════════════════
         CALLER — criar sala
         ═══════════════════════════════════════════════════════════════ */
      window.createRoom = async () => {
        if (!db) return alert("Configure o Firebase primeiro");
        const btn = document.getElementById("createBtn");
        btn.disabled = true;

        try {
          isCaller = true;
          answererSeen = false;

          // gera código único
          for (let i = 0; i < 5 && !roomId; i++) {
            const candidate = genCode();
            const snap = await get(ref(db, `rooms/${candidate}`));
            if (!snap.exists()) roomId = candidate;
          }
          if (!roomId) throw new Error("Não foi possível gerar código único");

          log("Criando sala " + roomId, "step");

          localStream = await startCamera(currentFacing);
          log("✓ Câmera local ok", "ok");
          showCall();

          newPeer();
          localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));

          const offer = await pc.createOffer();
          const roomRef = ref(db, `rooms/${roomId}`);

          // Grava a sala ANTES de setLocalDescription, para que o "set"
          // não apague candidatos ICE que já tenham chegado.
          await set(roomRef, {
            createdAt: Date.now(),
            offer: { type: offer.type, sdp: offer.sdp },
          });
          onDisconnect(roomRef).remove();
          log("✓ Sala salva com offer", "ok");

          // só agora começa a coleta de ICE (sala já existe)
          await pc.setLocalDescription(offer);
          setStatus("Aguardando alguém entrar…");

          // answer recebida
          unsubs.push(
            onValue(ref(db, `rooms/${roomId}/answer`), async (snap) => {
              const ans = snap.val();
              if (!ans || !pc || pc.currentRemoteDescription) return;
              log("← Answer recebida", "step");
              try {
                await pc.setRemoteDescription(new RTCSessionDescription(ans));
                await flushCandidates();
                setStatus("Conectando…");
              } catch (e) {
                log("❌ setRemoteDescription: " + e.message, "err");
              }
            }),
          );

          // candidatos do answerer
          unsubs.push(
            onChildAdded(
              ref(db, `rooms/${roomId}/answererCandidates`),
              (snap) => {
                const c = snap.val();
                if (c) addCandidate(new RTCIceCandidate(c));
              },
            ),
          );

          // presença do answerer (detecta quando ele sai)
          unsubs.push(
            onValue(ref(db, `rooms/${roomId}/answerer`), (snap) => {
              const v = snap.val();
              if (v) {
                answererSeen = true;
              } else if (answererSeen && pc && !hangingUp) {
                log("⚠ O outro lado saiu da chamada", "warn");
                hangUp();
              }
            }),
          );
        } catch (e) {
          log("❌ " + e.message, "err");
          alert(e.message);
          btn.disabled = false;
        }
      };

      /* ═══════════════════════════════════════════════════════════════
         ANSWERER — entrar na sala
         ═══════════════════════════════════════════════════════════════ */
      window.joinRoom = async () => {
        if (!db) return alert("Configure o Firebase primeiro");
        const code = document
          .getElementById("roomInput")
          .value.trim()
          .toUpperCase();
        if (code.length < 4) return alert("Código inválido");

        try {
          isCaller = false;
          roomId = code;
          log("Entrando na sala " + roomId, "step");

          const roomSnap = await get(ref(db, `rooms/${roomId}`));
          if (!roomSnap.exists()) {
            alert("Sala não encontrada: " + roomId + "\n\nVerifique o código.");
            log("❌ Sala não existe", "err");
            roomId = null;
            return;
          }
          if (!roomSnap.val().offer) {
            alert("Sala existe, mas sem offer (chamador saiu?)");
            log("⚠ Sala sem offer", "warn");
            roomId = null;
            return;
          }

          localStream = await startCamera(currentFacing);
          log("✓ Câmera local ok", "ok");
          showCall();

          newPeer();
          localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));

          const roomRef = ref(db, `rooms/${roomId}`);

          // presença: se fechar a aba, o caller sabe
          const presenceRef = ref(db, `rooms/${roomId}/answerer`);
          await set(presenceRef, true);
          onDisconnect(presenceRef).remove();

          // offer
          unsubs.push(
            onValue(ref(db, `rooms/${roomId}/offer`), async (snap) => {
              const offer = snap.val();
              if (!offer || !pc || pc.currentRemoteDescription) return;
              log("← Offer recebida", "step");
              try {
                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                await flushCandidates();
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                await update(roomRef, {
                  answer: { type: answer.type, sdp: answer.sdp },
                });
                log("✓ Answer enviada", "ok");
                setStatus("Conectando…");
              } catch (e) {
                log("❌ Answer: " + e.message, "err");
              }
            }),
          );

          // candidatos do caller
          unsubs.push(
            onChildAdded(
              ref(db, `rooms/${roomId}/callerCandidates`),
              (snap) => {
                const c = snap.val();
                if (c) addCandidate(new RTCIceCandidate(c));
              },
            ),
          );

          // sala removida = chamador encerrou
          unsubs.push(
            onValue(roomRef, (snap) => {
              if (!snap.exists() && pc && !hangingUp) {
                log("⚠ Chamador encerrou a sala", "warn");
                hangUp();
              }
            }),
          );
        } catch (e) {
          log("❌ " + e.message, "err");
          alert(e.message);
          roomId = null;
        }
      };

      /* ═══════════════════════════════════════════════════════════════
         CONTROLES
         ═══════════════════════════════════════════════════════════════ */
      window.toggleMic = () => {
        if (!localStream) return;
        const a = localStream.getAudioTracks()[0];
        if (!a) return;
        micEnabled = !micEnabled;
        a.enabled = micEnabled;
        document.getElementById("micBtn").classList.toggle("off", !micEnabled);
        log(micEnabled ? "🎤 Microfone ligado" : "🔇 Microfone desligado", "l");
      };

      window.switchCamera = async () => {
        if (!localStream) return;
        currentFacing = currentFacing === "user" ? "environment" : "user";
        log("Trocando câmera → " + currentFacing, "step");
        try {
          const s = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: currentFacing },
              width: { ideal: 1280 },
              height: { ideal: 720 },
            },
          });
          const t = s.getVideoTracks()[0];

          if (pc) {
            const sender = pc
              .getSenders()
              .find((x) => x.track && x.track.kind === "video");
            if (sender) await sender.replaceTrack(t);
          }

          const old = localStream.getVideoTracks()[0];
          if (old) {
            old.stop();
            localStream.removeTrack(old);
          }
          localStream.addTrack(t);

          document.getElementById("localVideo").srcObject = localStream;
          document
            .getElementById("localVideo")
            .classList.toggle("rear", currentFacing === "environment");
          log("✓ Câmera trocada", "ok");
        } catch (e) {
          log("❌ " + e.message, "err");
        }
      };

      window.hangUp = async () => {
        if (hangingUp) return;
        hangingUp = true;

        unsubs.forEach((u) => {
          try {
            u();
          } catch {}
        });
        unsubs = [];

        if (pc) {
          try {
            pc.close();
          } catch {}
          pc = null;
        }

        if (localStream) {
          localStream.getTracks().forEach((t) => {
            try {
              t.stop();
            } catch {}
          });
          localStream = null;
        }

        if (roomId) {
          try {
            if (isCaller) {
              await remove(ref(db, `rooms/${roomId}`));
            } else {
              await remove(ref(db, `rooms/${roomId}/answerer`));
            }
          } catch {}
        }

        pendingCandidates = [];
        roomId = null;
        isCaller = false;
        answererSeen = false;

        document.getElementById("remoteVideo").srcObject = null;
        document.getElementById("localVideo").srcObject = null;
        document.getElementById("call").style.display = "none";
        document.getElementById("lobby").style.display = "flex";
        document.getElementById("roomInput").value = "";
        document.getElementById("createBtn").disabled = false;
        document.getElementById("micBtn").classList.remove("off");
        document.getElementById("status").classList.remove("hidden");
        document.getElementById("status").textContent = "Preparando…";
        micEnabled = true;
        logEl().innerHTML = "";

        hangingUp = false;
      };

      window.copyRoomCode = async () => {
        if (!roomId) return;
        try {
          await navigator.clipboard.writeText(roomId);
          alert("✅ Código copiado: " + roomId);
        } catch {
          prompt("Copie o código:", roomId);
        }
      };

      /* ═══════════════════════════════════════════════════════════════
         EXTRAS DE UX
         ═══════════════════════════════════════════════════════════════ */
      const roomInput = document.getElementById("roomInput");
      roomInput.addEventListener("input", (e) => {
        e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      });
      roomInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") window.joinRoom();
      });

      window.addEventListener("beforeunload", () => {
        try {
          if (pc) pc.close();
        } catch {}
        if (localStream) localStream.getTracks().forEach((t) => t.stop());
      });

      /* ═══════════════════════════════════════════════════════════════
         ANALYTICS (opcional — não quebra nada se falhar)
         ═══════════════════════════════════════════════════════════════ */
      import("https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js")
        .then(async ({ getAnalytics, isSupported }) => {
          if (await isSupported()) {
            getAnalytics(app);
            log("✓ Analytics ativo", "ok");
          } else {
            log("ℹ Analytics não suportado neste ambiente", "l");
          }
        })
        .catch(() => log("ℹ Analytics indisponível (normal em file://)", "l"));
    </script>
  </body>
</html>
